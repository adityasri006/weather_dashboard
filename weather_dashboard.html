<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1B2A4A 0%, #2E4370 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .dashboard {
    width: 100%;
    max-width: 720px;
    background: #EAF2FA;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }

  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }

  .search-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #1B2A4A;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
  }

  .search-bar button {
    padding: 12px 20px;
    background: #1B2A4A;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }

  .search-bar button:hover { background: #29406b; }

  .favorites {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .favorites button {
    padding: 6px 14px;
    background: white;
    border: 1px solid #8A99AC;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    color: #1B2A4A;
  }

  .favorites button:hover { background: #dce7f5; }

  .favorites .star {
    background: #F5A623;
    border-color: #F5A623;
    color: white;
  }

  #message {
    text-align: center;
    color: #5B4B8A;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 8px;
  }

  .current {
    display: none;
    text-align: center;
    padding: 24px 0 32px;
  }

  .current .city {
    font-size: 24px;
    font-weight: 600;
    color: #1B2A4A;
  }

  .current .temp {
    font-size: 64px;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.1;
  }

  .current .desc {
    font-size: 16px;
    color: #5B4B8A;
    margin-bottom: 16px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat {
    background: white;
    border-radius: 10px;
    padding: 12px 20px;
    min-width: 100px;
  }

  .stat .label {
    font-size: 12px;
    color: #8A99AC;
    text-transform: uppercase;
  }

  .stat .value {
    font-size: 18px;
    font-weight: 600;
    color: #1B2A4A;
  }

  .forecast {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .forecast .day {
    background: white;
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
  }

  .forecast .day-name {
    font-size: 13px;
    font-weight: 600;
    color: #1B2A4A;
    margin-bottom: 6px;
  }

  .forecast .icon { font-size: 28px; margin-bottom: 6px; }

  .forecast .hi { font-size: 15px; font-weight: 600; color: #1B2A4A; }
  .forecast .lo { font-size: 13px; color: #8A99AC; }

  @media (max-width: 600px) {
    .forecast { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="search-bar">
    <input type="text" id="cityInput" placeholder="Search for a city..." />
    <button id="searchBtn">Search</button>
  </div>

  <div class="favorites" id="favorites"></div>

  <div id="message">Search a city to see the weather</div>

  <div class="current" id="current">
    <div class="city" id="cityName"></div>
    <div class="temp" id="temp"></div>
    <div class="desc" id="desc"></div>
    <div class="stats">
      <div class="stat">
        <div class="label">Humidity</div>
        <div class="value" id="humidity"></div>
      </div>
      <div class="stat">
        <div class="label">Wind</div>
        <div class="value" id="wind"></div>
      </div>
      <div class="stat">
        <div class="label">Feels like</div>
        <div class="value" id="feelsLike"></div>
      </div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>
</div>

<script>
  // ---- Weather code to description/icon mapping (Open-Meteo standard) ----
  const WEATHER_CODES = {
    0: ['Clear sky', '☀️'],
    1: ['Mainly clear', '🌤️'],
    2: ['Partly cloudy', '⛅'],
    3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'],
    48: ['Fog', '🌫️'],
    51: ['Light drizzle', '🌦️'],
    53: ['Drizzle', '🌦️'],
    55: ['Heavy drizzle', '🌧️'],
    61: ['Light rain', '🌦️'],
    63: ['Rain', '🌧️'],
    65: ['Heavy rain', '🌧️'],
    71: ['Light snow', '🌨️'],
    73: ['Snow', '🌨️'],
    75: ['Heavy snow', '❄️'],
    80: ['Rain showers', '🌦️'],
    81: ['Rain showers', '🌧️'],
    82: ['Violent showers', '⛈️'],
    95: ['Thunderstorm', '⛈️'],
    96: ['Thunderstorm', '⛈️'],
    99: ['Thunderstorm', '⛈️'],
  };

  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const messageEl = document.getElementById('message');
  const currentEl = document.getElementById('current');
  const forecastEl = document.getElementById('forecast');
  const favoritesEl = document.getElementById('favorites');

  let favorites = JSON.parse(localStorage.getItem('weatherFavorites') || '["London","Tokyo","New York"]');

  function renderFavorites() {
    favoritesEl.innerHTML = '';
    favorites.forEach(city => {
      const btn = document.createElement('button');
      btn.textContent = city;
      btn.onclick = () => { cityInput.value = city; fetchWeather(city); };
      favoritesEl.appendChild(btn);
    });
  }

  function saveFavorite(city) {
    if (!favorites.includes(city)) {
      favorites.push(city);
      if (favorites.length > 6) favorites.shift();
      localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
      renderFavorites();
    }
  }

  async function fetchWeather(city) {
    if (!city.trim()) return;
    messageEl.textContent = 'Loading...';
    currentEl.style.display = 'none';
    forecastEl.style.display = 'none';

    try {
      // Step 1: Geocode the city name to lat/lon (free, no API key required)
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
      const geoData = await geoRes.json();

      if (!geoData.results || geoData.results.length === 0) {
        messageEl.textContent = `Could not find "${city}". Try a different spelling.`;
        return;
      }

      const { latitude, longitude, name, country } = geoData.results[0];

      // Step 2: Fetch current weather + 5-day forecast
      const weatherRes = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`
      );
      const weatherData = await weatherRes.json();

      displayCurrent(name, country, weatherData.current);
      displayForecast(weatherData.daily);
      saveFavorite(name);
      messageEl.textContent = '';
    } catch (err) {
      console.error(err);
      messageEl.textContent = 'Something went wrong. Please try again.';
    }
  }

  function displayCurrent(name, country, current) {
    const [desc, icon] = WEATHER_CODES[current.weather_code] || ['Unknown', '❓'];

    document.getElementById('cityName').textContent = `${name}, ${country}`;
    document.getElementById('temp').textContent = `${icon} ${Math.round(current.temperature_2m)}°C`;
    document.getElementById('desc').textContent = desc;
    document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
    document.getElementById('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;

    currentEl.style.display = 'block';
  }

  function displayForecast(daily) {
    forecastEl.innerHTML = '';
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    daily.time.forEach((dateStr, i) => {
      const [desc, icon] = WEATHER_CODES[daily.weather_code[i]] || ['Unknown', '❓'];
      const date = new Date(dateStr);
      const dayName = i === 0 ? 'Today' : dayNames[date.getDay()];

      const dayCard = document.createElement('div');
      dayCard.className = 'day';
      dayCard.innerHTML = `
        <div class="day-name">${dayName}</div>
        <div class="icon">${icon}</div>
        <div class="hi">${Math.round(daily.temperature_2m_max[i])}°</div>
        <div class="lo">${Math.round(daily.temperature_2m_min[i])}°</div>
      `;
      forecastEl.appendChild(dayCard);
    });

    forecastEl.style.display = 'grid';
  }

  searchBtn.addEventListener('click', () => fetchWeather(cityInput.value));
  cityInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') fetchWeather(cityInput.value);
  });

  // Initial load
  renderFavorites();
  fetchWeather('London');
</script>

</body>
</html>
